name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  native:
    name: Native ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-13
            rid: osx-x64
          - os: windows-latest
            rid: win-x64
    defaults:
      run:
        working-directory: ./src
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x
    - name: Install native toolchain
      if: startsWith(matrix.os, 'ubuntu')
      run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
    - name: Pack
      run: dotnet pack KartChrono.Cli -r ${{ matrix.rid }} -c Release -p:PackageVersion=${{ github.ref_name }} --output .
    - name: Stage binary
      shell: bash
      run: |
        publish="KartChrono.Cli/bin/Release/net10.0/${{ matrix.rid }}/publish"
        mkdir -p ../artifacts
        if [ -f "$publish/KartChrono.Cli.exe" ]; then
          cp "$publish/KartChrono.Cli.exe" kartchrono.exe
          7z a "../artifacts/kartchrono-${{ github.ref_name }}-${{ matrix.rid }}.zip" kartchrono.exe
        else
          cp "$publish/KartChrono.Cli" kartchrono
          chmod +x kartchrono
          tar -czf "../artifacts/kartchrono-${{ github.ref_name }}-${{ matrix.rid }}.tar.gz" kartchrono
        fi
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: nupkg-${{ matrix.rid }}
        path: src/*.nupkg
    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: binary-${{ matrix.rid }}
        path: artifacts/*

  portable:
    name: Portable package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x.x
    - name: Pack framework-dependent fallback
      run: dotnet pack KartChrono.Cli -r any -p:PublishAot=false -c Release -p:PackageVersion=${{ github.ref_name }} --output .
    - name: Pack pointer package
      run: dotnet pack KartChrono.Cli -c Release -p:PackageVersion=${{ github.ref_name }} --output .
    - name: Upload fallback package
      uses: actions/upload-artifact@v7
      with:
        name: nupkg-any
        path: src/KartChrono.Cli.any.*.nupkg
    - name: Upload pointer package
      uses: actions/upload-artifact@v7
      with:
        name: nupkg-pointer
        path: src/KartChrono.Cli.${{ github.ref_name }}.nupkg

  publish:
    name: Publish to NuGet
    needs: [native, portable]
    runs-on: ubuntu-latest
    steps:
    - name: Download runtime-specific packages
      uses: actions/download-artifact@v8
      with:
        pattern: nupkg-*
        path: packages
        merge-multiple: true
    - name: Push runtime-specific packages
      run: |
        for package in packages/KartChrono.Cli.*-*.nupkg packages/KartChrono.Cli.any.*.nupkg; do
          [ -e "$package" ] || continue
          dotnet nuget push "$package" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        done
    - name: Push pointer package last
      run: dotnet nuget push "packages/KartChrono.Cli.${{ github.ref_name }}.nupkg" --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  release:
    name: Attach binaries to release
    needs: native
    runs-on: ubuntu-latest
    steps:
    - name: Download binaries
      uses: actions/download-artifact@v8
      with:
        pattern: binary-*
        path: binaries
        merge-multiple: true
    - name: Create release
      run: gh release create "${{ github.ref_name }}" binaries/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
